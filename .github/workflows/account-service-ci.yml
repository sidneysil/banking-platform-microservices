name: Account Service CI

on:
  push:
    branches:
      - feature/transaction-service
    paths:
      - 'backend/account-service/**'
      - '.github/workflows/account-service-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: account_db
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U banking -d account_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/account_db
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking

    steps:

      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testar e gerar JAR
        working-directory: backend/account-service
        run: |
          chmod +x mvnw
          ./mvnw clean test package

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Criar imagem Docker
        working-directory: backend/account-service
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/banking-account-service:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/banking-account-service:latest \
            .

      - name: Publicar imagem no Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/banking-account-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/banking-account-service:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Atualizar imagem do Account Service
        shell: powershell
        run: |
          kubectl set image deployment/account-service account-service=${{ secrets.DOCKERHUB_USERNAME }}/banking-account-service:latest

      - name: Aguardar rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/account-service --timeout=120s

      - name: Verificar pods
        shell: powershell
        run: |
          kubectl get pods